name: Website monitor

on:
  schedule:
     - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check website and alert Telegram
        env:
          MONITOR_URL: https://vtu.internyet.in/dashboard/student/applied-internships
          STATE_FILE: state/site-status.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_SUBSTRING: ${{ secrets.EXPECTED_SUBSTRING }}
        run: python scripts/check_site.py

      - name: Commit updated state
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- state/site-status.json; then
            echo "No state changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/site-status.json
          git commit -m "Update website monitor state"
          
          # Pull latest changes before pushing
          git pull origin $BRANCH_NAME --rebase
          
          git push origin HEAD:$BRANCH_NAME
