name: Website monitor

on:
  schedule:
     - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check website and alert Telegram
        env:
          MONITOR_URL: https://vtu.internyet.in/dashboard/student/applied-internships
          SUPABASE_URL: https://txekjbiathutfhxfzkhd.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STATE_FILE: state/site-status.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_SUBSTRING: ${{ secrets.EXPECTED_SUBSTRING }}
        run: python scripts/check_site.py

      - name: Note
        run: echo "Status synced to Supabase database"
